selectors:
  - name: silver_daily
    description: Everything bronze -> silver (seeds, staging, snapshots, history, current, tests).
    definition:
      method: tag
      value: layer_silver
      parents: true

  - name: silver_codelists
    description: Codelists only - a good first run.
    definition:
      method: tag
      value: domain_ciselnik
      parents: true

  - name: silver_cdc
    description: The incremental (CDC) entities and their current tables.
    definition:
      method: tag
      value: pattern_cdc_scd2
      parents: true
      children: true
