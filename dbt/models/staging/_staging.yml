  # --- CDC staging (pattern_cdc_scd2) ------------------------------------------
  - name: stg_ccd__party_id_mapping
    description: Complete resolved party-id mapping (input of mapovani_id_partnera_hist, batch_mode full).
    config:
      tags: [pattern_cdc_scd2]
    columns:
      - name: mapovani_id_partnera_hkey
        data_tests: [unique, not_null]
      - name: cilovy_partner_id
        data_tests: [not_null]
    data_tests:
      - party_mapping_fully_resolved

  - name: stg_redy__client_needs_analysis
    description: REDy analyses, one row per Kafka message (input of analyza_potreb_klienta_hist).
    config:
      tags: [pattern_cdc_scd2]
    columns:
      - name: analyza_potreb_klienta_hkey
        data_tests: [not_null]
      - name: platnost_od_ts
        data_tests: [not_null]

  - name: stg_kcl__sco_bdt_task
    description: KCL tasks, one row per bronze row (input of ukol_hist).
    config:
      tags: [pattern_cdc_scd2]
    columns:
      - name: ukol_hkey
        data_tests: [not_null]
      - name: platnost_od_ts
        data_tests: [not_null]
      - name: typ_zaznamu_kod
        data_tests:
          - accepted_or_unknown:
              config: {severity: warn}

  - name: stg_kcl__sco_bdt_task_delete
    description: KCL task deletions (delete markers for ukol_hist).
    config:
      tags: [pattern_cdc_scd2]
    columns:
      - name: ukol_hkey
        data_tests: [not_null]
      - name: platnost_od_ts
        data_tests: [not_null]
