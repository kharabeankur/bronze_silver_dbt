# ---------------------------------------------------------------------------
# Staging contract tests. In `dbt build` these run BEFORE the snapshot /
# incremental model that reads the view, so a broken key never reaches
# silver: severity error blocks the downstream node (Load_Pattern check 1).
# ---------------------------------------------------------------------------
version: 2

models:
  - name: stg_kcl__adt_campaign_channel
    description: Snapshot input for distribucni_kanal_hist (pattern_snapshot).
    config:
      tags: [pattern_snapshot]
    columns:
      - name: distribucni_kanal_hkey
        data_tests: [unique, not_null]
      - name: hash_zaznamu
        data_tests: [not_null]

  - name: stg_kcl__adt_solution_state
    description: Snapshot input for stav_kontaktu_hist (pattern_snapshot).
    config:
      tags: [pattern_snapshot]
    columns:
      - name: stav_kontaktu_hkey
        data_tests: [unique, not_null]
      - name: hash_zaznamu
        data_tests: [not_null]

  - name: stg_kcl__adt_taskstatus
    description: Snapshot input for stav_ukolu_hist (pattern_snapshot).
    config:
      tags: [pattern_snapshot]
    columns:
      - name: stav_ukolu_hkey
        data_tests: [unique, not_null]
      - name: hash_zaznamu
