        data_tests: [unique, not_null]
      - name: hash_zaznamu
        data_tests: [not_null]

  - name: stg_kcl__bdt_campaign_wave
    description: Snapshot input for kampan_hist (pattern_snapshot).
    config:
      tags: [pattern_snapshot]
    columns:
      - name: kampan_hkey
        data_tests: [unique, not_null]
      - name: hash_zaznamu
