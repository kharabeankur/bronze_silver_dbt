# Silver ods_d_distribuce - one row per business key (current state).
# Tests run inside `dbt build` right after each table:
#   unique / not_null on the hash key  -> error (stops dependent models)
#   relationships to codelists         -> warning (FKs are NOT ENFORCED in Databricks)
version: 2

models:
  - name: kampan
    config:
      liquid_clustered_by: ['kampan_hkey']
    columns:
      - name: kampan_hkey
        data_tests: [unique, not_null]
      - name: distribucni_kanal_hkey
        data_tests:
          - relationships:
              to: ref('distribucni_kanal')
              field: distribucni_kanal_hkey
              config: {severity: warn}

  - name: ukol
    config:
      liquid_clustered_by: ['ukol_hkey']
    columns:
      - name: ukol_hkey
        data_tests: [unique, not_null]
      - name: typ_ukolu_hkey
        data_tests:
          - relationships:
              to: ref('typ_ukolu')
              field: typ_ukolu_hkey
              config: {severity: warn}
      - name: podtyp_ukolu_hkey
        data_tests:
          - relationships:
              to: ref('podtyp_ukolu')
              field: podtyp_ukolu_hkey
              config: {severity: warn}
      - name: stav_ukolu_hkey
        data_tests:
          - relationships:
              to: ref('stav_ukolu')
              field: stav_ukolu_hkey
              config: {severity: warn}
      - name: zpusob_dokonceni_hkey
        data_tests:
          - relationships:
              to: ref('zpusob_dokonceni_ukolu')
              field: zpusob_dokonceni_ukolu_hkey
              config: {severity: warn}
      - name: smazano_priznak
        data_tests: [not_null]
