# Silver ods_k_klient - one row per business key (current state).
# Tests run inside `dbt build` right after each table:
#   unique / not_null on the hash key  -> error (stops dependent models)
#   relationships to codelists         -> warning (FKs are NOT ENFORCED in Databricks)
version: 2

models:
  - name: mapovani_id_partnera
    config:
      liquid_clustered_by: ['mapovani_id_partnera_hkey']
    columns:
      - name: mapovani_id_partnera_hkey
        data_tests: [unique, not_null]
    data_tests:
      - party_mapping_fully_resolved

  - name: analyza_potreb_klienta
    config:
      liquid_clustered_by: ['analyza_potreb_klienta_hkey']
    columns:
      - name: analyza_potreb_klienta_hkey
        data_tests: [unique, not_null]
