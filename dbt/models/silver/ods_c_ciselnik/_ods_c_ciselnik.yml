# Silver ods_c_ciselnik - contracts and data quality tests (Blueprint 5.1, RFP 2.1.2).
# Test severity: error = blocks downstream nodes, warn = P2 alert.
version: 2

models:
  - name: distribucni_kanal
    description: Current state of distribucni_kanal - exactly the open versions of distribucni_kanal_hist.
    config:
      materialized: table
      liquid_clustered_by: ['distribucni_kanal_hkey']
      tags: [pattern_snapshot]
    columns:
      - name: distribucni_kanal_hkey
        data_tests:
          - unique
          - not_null
          - scd2_current_matches_history:
              history: ref('distribucni_kanal_hist')
