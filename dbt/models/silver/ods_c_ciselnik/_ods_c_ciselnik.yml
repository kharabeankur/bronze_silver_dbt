# Silver ods_c_ciselnik - one row per business key (current state).
# Tests run inside `dbt build` right after each table:
#   unique / not_null on the hash key  -> error (stops dependent models)
#   relationships to codelists         -> warning (FKs are NOT ENFORCED in Databricks)
version: 2

models:
  - name: distribucni_kanal
    config:
      liquid_clustered_by: ['distribucni_kanal_hkey']
    columns:
      - name: distribucni_kanal_hkey
        data_tests: [unique, not_null]

  - name: stav_kontaktu
    config:
      liquid_clustered_by: ['stav_kontaktu_hkey']
    columns:
      - name: stav_kontaktu_hkey
        data_tests: [unique, not_null]

  - name: stav_ukolu
    config:
      liquid_clustered_by: ['stav_ukolu_hkey']
    columns:
      - name: stav_ukolu_hkey
        data_tests: [unique, not_null]

  - name: typ_ukolu
    config:
      liquid_clustered_by: ['typ_ukolu_hkey']
    columns:
      - name: typ_ukolu_hkey
        data_tests: [unique, not_null]

  - name: podtyp_ukolu
    config:
      liquid_clustered_by: ['podtyp_ukolu_hkey']
    columns:
      - name: podtyp_ukolu_hkey
        data_tests: [unique, not_null]
      - name: typ_ukolu_hkey
        data_tests:
          - relationships:
              to: ref('typ_ukolu')
              field: typ_ukolu_hkey
              config: {severity: warn}

  - name: zpusob_dokonceni_ukolu
    config:
      liquid_clustered_by: ['zpusob_dokonceni_ukolu_hkey']
    columns:
      - name: zpusob_dokonceni_ukolu_hkey
        data_tests: [unique, not_null]
      - name: typ_ukolu_hkey
        data_tests:
          - relationships:
              to: ref('typ_ukolu')
              field: typ_ukolu_hkey
              config: {severity: warn}

  - name: produkt
    config:
      liquid_clustered_by: ['produkt_hkey']
    columns:
      - name: produkt_hkey
        data_tests: [unique, not_null]

  - name: mezinarodni_predvolba
    config:
      liquid_clustered_by: ['mezinarodni_predvolba_hkey']
    columns:
      - name: mezinarodni_predvolba_hkey
        data_tests: [unique, not_null]

  - name: typ_role_partnera
    config:
      liquid_clustered_by: ['typ_role_partnera_hkey']
    columns:
      - name: typ_role_partnera_hkey
        data_tests: [unique, not_null]

  - name: stav_smlouvy
    config:
      liquid_clustered_by: ['stav_smlouvy_hkey']
    columns:
      - name: stav_smlouvy_hkey
        data_tests: [unique, not_null]
