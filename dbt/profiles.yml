# ---------------------------------------------------------------------------
# Connection profile - values come only from environment variables (.env).
# dbt finds this file automatically when you run dbt from the dbt/ folder.
#   local       personal access token (your laptop)
#   dev/test/prod  service principal (OAuth M2M) - for scheduled/CI runs later
# Time zone is pinned to UTC so timestamps compare consistently with 9999-12-31.
# ---------------------------------------------------------------------------
gcp_lakehouse:
  target: "{{ env_var('DBT_TARGET', 'local') }}"
  outputs:
    local:
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_DATABRICKS_TOKEN') }}"
      catalog: dbx_cz_gcz_dev_czlake_silver
      schema: dbt_stg
      threads: 4
      session_properties:
        spark.sql.session.timeZone: UTC

    dev: &service_principal
      type: databricks
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      client_id: "{{ env_var('DBT_DATABRICKS_CLIENT_ID') }}"
      client_secret: "{{ env_var('DBT_DATABRICKS_CLIENT_SECRET') }}"
      catalog: "{{ env_var('DBT_DEFAULT_CATALOG', 'dbx_cz_gcz_dev_czlake_silver') }}"
      schema: dbt_stg
      threads: 8
      session_properties:
        spark.sql.session.timeZone: UTC
    test: *service_principal
    prod: *service_principal
